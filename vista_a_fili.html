  // locale più vicino (stesso piano)
  const pian=best.lvl==='terra'?'terra':best.lvl==='ext'?'esterno':'primo';let nm='',bd=1e9;
  {for(const n in ST){if(ST[n].piano!==pian)continue;const r=ST[n];let dd=Math.hypot(r.x-x,r.z-z);if(polyHit(r.poly,x,z))dd=-1;if(dd<bd){bd=dd;nm=n}}}
  st.sel={x,y:y-off,z,lvl:best.lvl,tipo:best.tipo,stanza:nm,dist:bd};info()}
function info(){
  const el=document.getElementById('info'),s=st.sel;el.classList.toggle('has',!!s);
  if(!s){el.innerHTML='Trascina per girare · rotella per lo zoom · tocca un puntino per il nome<br><b>Doppio clic</b> su un punto della casa per leggere le coordinate';return}
  const base=s.lvl==='primo'||s.lvl==='tetto'?CFG.y1:0;
  const quando=s.stanza?(s.dist<0?'dentro ':'vicino a ')+nome(s.stanza):'';
  const txt='{"x":'+s.x.toFixed(2)+',"y":'+s.y.toFixed(2)+',"z":'+s.z.toFixed(2)+'}';
  el.innerHTML='<b>'+s.tipo+(s.lvl==='terra'?' · piano terra':s.lvl==='primo'?' · primo piano':s.lvl==='tetto'?' · falda':'')+'</b>'+(quando?' · '+quando:'')+
   '<br><b>X '+s.x.toFixed(2)+' · Z '+s.z.toFixed(2)+' · Y '+s.y.toFixed(2)+'</b> m'+(s.lvl==='ext'?'':' <span style="opacity:.7">('+(s.y-base).toFixed(2)+' m sopra il pavimento del piano)</span>')+
   '<br><button id="cp">Copia</button> <button id="cl">Chiudi</button>';
  document.getElementById('cp').onclick=ev=>{const b=ev.target;
    const fall=()=>{b.outerHTML='<input id="cv" readonly value=\''+txt+'\' style="width:210px">';const i=document.getElementById('cv');i.focus();i.select()};
    let ok=false;try{const ta=document.createElement('textarea');ta.value=txt;ta.style.cssText='position:fixed;left:-999px;top:0;opacity:0';document.body.appendChild(ta);ta.focus();ta.select();ok=document.execCommand('copy');ta.remove()}catch(e){}
    if(ok){b.textContent='Copiato ✓';return}
    try{navigator.clipboard.writeText(txt).then(()=>{b.textContent='Copiato ✓'},fall)}catch(e){fall()}};
  document.getElementById('cl').onclick=()=>{st.sel=null;info()}}


// ================= interazione con Home Assistant =================
const HS=()=>{try{return parent.document.querySelector('home-assistant').hass}catch(e){return null}};
const stt=id=>{const h=HS();return h&&h.states?h.states[id]||null:null};
const isOn=id=>{const s=stt(id);return !!s&&s.state==='on'};
const mAlarmsRaw=m=>{const g={};for(const a of (m.allarmi||[])){const s=stt(a.e);if(!s||s.state!=='on')continue;const ts=new Date(s.last_changed).getTime()||0;
    if(!g[a.t]||ts>g[a.t].ts)g[a.t]={e:a.e,t:a.t,ts,k:'a:'+m.nome+':'+a.t+':'+ts}}return Object.values(g)};
const mAlarms=m=>mAlarmsRaw(m).filter(a=>!acked(a.k));
const moreInfo=id=>{try{parent.document.querySelector('home-assistant').dispatchEvent(new CustomEvent('hass-more-info',{detail:{entityId:id},bubbles:true,composed:true}))}catch(e){}};
function tcolor(v){const S=[[16,[60,120,255]],[20,[40,200,200]],[22,[80,230,100]],[24,[240,220,60]],[26,[255,150,40]],[28,[255,60,50]]];
  if(v<=S[0][0])return S[0][1].join(',');if(v>=S[5][0])return S[5][1].join(',');
  for(let i=0;i<5;i++){if(v<=S[i+1][0]){const f=(v-S[i][0])/(S[i+1][0]-S[i][0]);return S[i][1].map((c,j)=>Math.round(c+(S[i+1][1][j]-c)*f)).join(',')}}return '80,230,100'}
const ago=ms=>{const s=Math.max(0,Math.round(ms/1000));if(s<60)return s+' s fa';if(s<3600)return Math.round(s/60)+' min fa';if(s<86400)return Math.round(s/3600)+' h fa';return Math.round(s/86400)+' g fa'};
const fmtN=(v,d=1)=>v.toFixed(d).replace('.',',');

// pannello (telecamera / sensore / consigli)
let panelKind=null,panelTimer=null,ptzTimer=null,panelM=null;
const P=()=>document.getElementById('panel');
function closePanel(){clearInterval(panelTimer);panelTimer=null;panelKind=null;panelM=null;P().hidden=true;P().innerHTML=''}
function togglePanel(k){if(panelKind===k){closePanel();return}closePanel();if(k==='adv')openAdv()}
function hitMark(mx,my){let best=null,bd=18;for(const d of mdots){const k=Math.hypot(d.x-mx,d.y-my);if(k<bd){bd=k;best=d}}
  if(!best)return false;closePanel();if(best.m.tipo==='camera')openCam(best.m);else openSens(best.m);return true}
function camImg(m){const s=stt(m.entita),tok=s&&s.attributes&&s.attributes.access_token;return tok?'/api/camera_proxy/'+m.entita+'?token='+tok+'&_='+Date.now():''}
function lastSeen(m){let best=null;for(const a of (m.allarmi||[])){const s=stt(a.e);if(!s)continue;const ts=new Date(s.last_changed).getTime();if(!best||ts>best.ts)best={ts,t:a.t,on:s.state==='on'}}
  return best?(best.on?best.t+' in corso':'Ultimo rilevamento: '+best.t+' '+ago(Date.now()-best.ts)):''}
function openCam(m){panelKind='cam';panelM=m;const p=P();p.hidden=false;const pz=m.ptz,hasS=!!HS();
  const btn=(c,l,tt)=>'<button data-c="'+c+'" title="'+tt+'" style="width:36px;height:34px;padding:0">'+l+'</button>';
  p.innerHTML='<h3><span>'+m.nome+'</span><button id="px">✕</button></h3><img id="li" alt="immagine">'+
   '<div id="ls" style="margin-top:5px;font-size:12px"></div>'+
   (pz?'<div class="row"><span style="opacity:.7">PTZ</span>'+btn('MOVE_LEFT','◀','Sinistra')+btn('MOVE_UP','▲','Su')+btn('MOVE_DOWN','▼','Giù')+btn('MOVE_RIGHT','▶','Destra')+btn('ZOOM_IN','＋','Zoom +')+btn('ZOOM_OUT','－','Zoom −')+'</div><div class="row"><select id="ps"><option value="">Preset…</option></select></div>':'')+
   '<div class="row"><button id="mi">Apri in HA (video)</button></div><small>Tieni premuta una freccia per muovere; al rilascio la dome si ferma.</small>';
  document.getElementById('px').onclick=closePanel;document.getElementById('mi').onclick=()=>moreInfo(m.entita);
  const im=document.getElementById('li');im.onerror=()=>{document.getElementById('ls').textContent='Immagine non disponibile (apri in HA)'};
  const upd=()=>{if(panelKind!=='cam')return;const u=camImg(m);if(u)im.src=u;document.getElementById('ls').textContent=lastSeen(m)||''};
  upd();panelTimer=setInterval(upd,1200);
  if(pz){p.querySelectorAll('[data-c]').forEach(b=>{const c=b.dataset.c;
      b.addEventListener('pointerdown',e=>{e.preventDefault();ptz(m,c)});['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>ptzStop(m)))});
    const s=stt(pz.preset),sel=document.getElementById('ps');if(s&&s.attributes&&s.attributes.options){s.attributes.options.forEach(o=>{const op=document.createElement('option');op.value=o;op.textContent=o;sel.append(op)});sel.value=s.state}
    sel.onchange=()=>{if(sel.value){const h=HS();h&&h.callService('select','select_option',{entity_id:pz.preset,option:sel.value})}}}}
function ptz(m,c){const h=HS();if(!h)return;clearTimeout(ptzTimer);h.callService('mqtt','publish',{topic:'frigate/'+m.ptz.frigate+'/ptz',payload:c});ptzTimer=setTimeout(()=>ptzStop(m),2500)}
function ptzStop(m){clearTimeout(ptzTimer);const h=HS();if(h&&m&&m.ptz)h.callService('mqtt','publish',{topic:'frigate/'+m.ptz.frigate+'/ptz',payload:'STOP'})}
function openSens(m){panelKind='sens';panelM=m;const p=P();p.hidden=false;
  const upd=()=>{if(panelKind!=='sens')return;const tv=stt(m.entita),hv=m.entita2?stt(m.entita2):null,bv=m.batteria?stt(m.batteria):null;
    p.innerHTML='<h3><span>'+m.nome+'</span><button id="px">✕</button></h3>'+
     '<div style="font-size:22px;color:var(--g);font-weight:700">'+(tv&&!isNaN(parseFloat(tv.state))?fmtN(parseFloat(tv.state))+'°C':'—')+(hv&&!isNaN(parseFloat(hv.state))?'  <span style="font-size:16px">'+Math.round(parseFloat(hv.state))+'%</span>':'')+'</div>'+
     '<small>'+(m.locale?nome(m.locale)+' · ':'')+(bv&&!isNaN(parseFloat(bv.state))?'batteria '+Math.round(parseFloat(bv.state))+'% · ':'')+(tv?'aggiornato '+ago(Date.now()-new Date(tv.last_changed).getTime()):'')+'</small>'+
     '<div class="row"><button id="mi">Storico in HA</button></div>';
    document.getElementById('px').onclick=closePanel;document.getElementById('mi').onclick=()=>moreInfo(m.entita)};
  upd();panelTimer=setInterval(upd,5000)}


// ---- conferma di lettura: scorri verso sinistra per eliminare
const ACK_KEY='villa_delvis_ack';
function ackLoad(){try{const o=JSON.parse(localStorage.getItem(ACK_KEY)||'{}'),n=Date.now();for(const k in o)if(o[k]<n)delete o[k];return o}catch(e){return {}}}
function ackSet(k,ms){try{const o=ackLoad();o[k]=Date.now()+ms;localStorage.setItem(ACK_KEY,JSON.stringify(o))}catch(e){ACKMEM[k]=Date.now()+ms}}
const ACKMEM={};
const acked=k=>{const o=ackLoad();return !!o[k]||(ACKMEM[k]&&ACKMEM[k]>Date.now())};
function ackReset(prefix){try{const o=ackLoad();for(const k in o)if(k.startsWith(prefix))delete o[k];localStorage.setItem(ACK_KEY,JSON.stringify(o))}catch(e){}for(const k in ACKMEM)if(k.startsWith(prefix))delete ACKMEM[k]}
function swipeLeft(el,onDismiss){let x0=null,dx=0,moved=false;
  el.addEventListener('pointerdown',e=>{x0=e.clientX;dx=0;moved=false;el.style.transition='none';try{el.setPointerCapture(e.pointerId)}catch(_){}});
  el.addEventListener('pointermove',e=>{if(x0===null)return;dx=e.clientX-x0;if(Math.abs(dx)>6)moved=true;const d=Math.min(0,dx);el.style.transform='translateX('+d+'px)';el.style.opacity=String(Math.max(.25,1+d/260))});
  const end=()=>{if(x0===null)return;const w=el.getBoundingClientRect().width;el.style.transition='transform .2s,opacity .2s';
    if(dx<-Math.min(90,w*.3)){el.style.transform='translateX(-110%)';el.style.opacity='0';setTimeout(onDismiss,200)}else{el.style.transform='';el.style.opacity=''}
    x0=null;setTimeout(()=>{moved=false},50)};
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
  el.addEventListener('click',e=>{if(moved){e.stopImmediatePropagation();e.preventDefault()}},true)}

// banner allarmi
let alertKey='',alertAckKey='';
function updAlert(){const el=document.getElementById('alert');let first=null,mm=null,ak='';
  for(const m of marks){const a=mAlarms(m);if(a.length){first=a[0];mm=m;ak=a[0].k;break}}
  const key=first?ak:'';if(key===alertKey)return;alertKey=key;alertAckKey=ak;
  el.style.transform='';el.style.opacity='';
  if(!key){el.hidden=true;return}
  const S=hassStates(),arm=S&&S['sensor.dhi_arc3800h_fw2_868_arm_state'];
  el.innerHTML='⚠ '+first.t+(first.t==='Veicolo'?' rilevato':' rilevata')+' · '+mm.nome+(arm&&arm.state?' · allarme '+(arm.state==='disarmed'?'disinserito':'inserito'):'')+'<div style="font-size:10px;font-weight:400;opacity:.7">tocca per aprire · scorri a sinistra per eliminare</div>';el.hidden=false;
  el.onclick=()=>{closePanel();openCam(mm)}}
(function(){const el=document.getElementById('alert');swipeLeft(el,()=>{ackSet(alertAckKey,24*3600*1000);el.hidden=true;alertKey='__ack__';setTimeout(()=>{alertKey=''},50)})})();
const hassStates=()=>{const h=HS();return h&&h.states?h.states:null};

// consigli
const ZONE=CFG.zone||[];
function coperta(z){return marks.some(m=>m.tipo==='camera'&&m.dir!=null&&(()=>{const dx=z.x-m.x,dz=z.z-m.z,d=Math.hypot(dx,dz);if(d>(m.raggio||6)+1.5)return false;let a=Math.atan2(dx,dz)*180/Math.PI-m.dir;a=((a+540)%360)-180;return Math.abs(a)<=(m.fov||90)/2+8})())}
function consigliTutti(){const S=hassStates(),out=[];
  if(!S)return [{liv:'info',t:'I consigli funzionano dentro Home Assistant (servono i valori dei sensori).'}];
  const num=id=>{const s=S[id];if(!s||s.state==='unavailable'||s.state==='unknown')return null;const n=parseFloat(s.state);return isNaN(n)?null:n};
  for(const m of marks){
    if(m.tipo==='sensore'){const tv=num(m.entita),hv=m.entita2?num(m.entita2):null,bv=m.batteria?num(m.batteria):null,L=m.locale?nome(m.locale):m.nome;
      if(tv===null)out.push({liv:'media',t:m.nome+': il sensore non risponde. Controlla batteria e Wi-Fi (si sveglia solo ogni tanto).',m});
      if(bv!==null&&bv<10)out.push({liv:'alta',t:m.nome+': batteria al '+Math.round(bv)+'%, sostituiscila subito.',m});else if(bv!==null&&bv<20)out.push({liv:'media',t:m.nome+': batteria al '+Math.round(bv)+'%, tienila d\'occhio.',m});
      if(hv!==null){if(hv>=70)out.push({liv:'alta',t:L+': umidità '+Math.round(hv)+'%, rischio muffa. Arieggia o usa un deumidificatore.',m});
        else if(hv>=60)out.push({liv:'info',t:L+': umidità '+Math.round(hv)+'%, un po\' alta. Arieggiare qualche minuto aiuta.',m});
        else if(hv<30)out.push({liv:'info',t:L+': aria secca ('+Math.round(hv)+'%). Un umidificatore può aiutare.',m})}
      if(tv!==null){if(tv>=27)out.push({liv:'media',t:L+': '+fmtN(tv)+'°, fa caldo. Schermi le finestre o apri per il ricambio d\'aria.',m});
        else if(tv<=17)out.push({liv:'media',t:L+': '+fmtN(tv)+'°, fa freddo. Controlla il riscaldamento.',m})}
      if(tv!==null&&hv!==null&&hv>=60&&tv<=20)out.push({liv:'media',t:L+': aria fredda e umida ('+fmtN(tv)+'°, '+Math.round(hv)+'%): possibile condensa sulle pareti.',m})}
    else{const s=S[m.entita];if(s&&s.state==='unavailable')out.push({liv:'alta',t:m.nome+': telecamera non raggiungibile.',m})}}
  const arm=S['sensor.dhi_arc3800h_fw2_868_arm_state'];
  for(const m of marks){const a=mAlarms(m);if(a.length)out.push({liv:'alta',k:'allarme:'+a[0].k,ak:a[0].k,t:a[0].t+(a[0].t==='Veicolo'?' rilevato':' rilevata')+' da '+m.nome+(arm&&arm.state&&arm.state!=='disarmed'?' con l\'allarme inserito: controlla subito le immagini.':'. L\'allarme è disinserito: verifica che sia una presenza prevista.'),m})}
  const scop=ZONE.filter(z=>!coperta(z)).map(z=>z.n);
  if(scop.length)out.push({liv:'info',t:'Nessuna telecamera inquadra '+scop.join(', ')+' (calcolo sul cono delle telecamere, senza contare ostacoli).'});
  const ord={alta:0,media:1,info:2};out.forEach(c=>{if(!c.k)c.k=c.t});out.sort((a,b)=>ord[a.liv]-ord[b.liv]);return out}
const consigli=()=>consigliTutti().filter(c=>!acked('c:'+c.k));
const nascosti=()=>consigliTutti().filter(c=>acked('c:'+c.k)).length;
const COL={alta:'#ff3030',media:'#ffb020',info:'#39ff14'};
function openAdv(){panelKind='adv';const p=P();p.hidden=false;
  const upd=()=>{if(panelKind!=='adv')return;const L=consigli(),nh=nascosti();
    p.innerHTML='<h3><span>Consigli ('+L.length+')</span><button id="px">✕</button></h3>'+
    (L.length?L.map((c,i)=>'<div class="adv" data-i="'+i+'"><span class="dot" style="background:'+COL[c.liv]+';box-shadow:0 0 8px '+COL[c.liv]+'"></span><span>'+c.t+'</span></div>').join(''):'<div style="padding:8px">Tutto regolare: nessun consiglio al momento.</div>')+
    '<div class="hint">'+(L.length?'Scorri a sinistra un consiglio per eliminarlo dopo averlo letto. ':'')+(nh?'<span class="lnk" id="rs">Ripristina '+nh+' eliminat'+(nh>1?'i':'o')+'</span>':'')+'</div>';
    document.getElementById('px').onclick=closePanel;const rs=document.getElementById('rs');if(rs)rs.onclick=()=>{ackReset('c:');upd();updBadge()};
    p.querySelectorAll('.adv').forEach(el=>{const c=L[+el.dataset.i];
      swipeLeft(el,()=>{ackSet('c:'+c.k,12*3600*1000);if(c.ak)ackSet(c.ak,24*3600*1000);upd();updBadge()});
      el.addEventListener('click',()=>{if(c.m){st.focus=c.m.nome;st.focusT=performance.now()+4000}})})};
  upd();panelTimer=setInterval(()=>{const act=document.activeElement;upd()},4000)}
function updBadge(){const L=consigli().filter(c=>c.liv!=='info'||true);const n=L.length,hi=L.some(c=>c.liv==='alta');
  consBtn.textContent='Consigli'+(n?' ('+n+')':'');consBtn.style.color=hi?'#ff6060':'';consBtn.style.borderColor=hi?'#ff303088':''}

// legenda temperature: media + posizione di ogni sensore sulla barra
function updLegend(){const L=document.getElementById('legend');if(L.hidden)return;const S=hassStates();
  const vals=[];for(const m of marks){if(m.tipo!=='sensore'||!m.entita)continue;const s=S&&S[m.entita],v=s?parseFloat(s.state):NaN;if(!isNaN(v))vals.push({m,v})}
  const lm=document.getElementById('lm'),dots=document.getElementById('ldots'),tx=document.getElementById('ltxt');
  if(!vals.length){lm.style.display='none';dots.innerHTML='';tx.textContent='Temperatura media — (nessun dato)';return}
  const avg=vals.reduce((a,x)=>a+x.v,0)/vals.length,pos=v=>Math.max(0,Math.min(100,(v-16)/12*100))+'%';
  lm.style.display='';lm.style.left=pos(avg);tx.textContent='Temperatura media '+fmtN(avg)+'° ('+vals.length+' locali)';
  if(dots.children.length!==vals.length){dots.innerHTML='';vals.forEach(()=>dots.append(document.createElement('span')))}
  vals.forEach((x,i)=>{const d=dots.children[i];d.style.left=pos(x.v);d.style.background='rgb('+tcolor(x.v)+')';d.title=(x.m.locale?nome(x.m.locale):x.m.nome)+' '+fmtN(x.v)+'°'})}
setInterval(updLegend,2000);setTimeout(updLegend,2500);
setInterval(updAlert,1000);setInterval(updBadge,5000);setTimeout(()=>{updAlert();updBadge()},2500);

// ---- ciclo
let last=performance.now(),idle=0;
function frame(t){
  requestAnimationFrame(frame);
  if(document.hidden){last=t;return}
  const dt=Math.min(.05,(t-last)/1000);last=t;
  if(tween){tween.t=Math.min(1,tween.t+dt/0.8);const e=1-Math.pow(1-tween.t,3);st.yaw=tween.y0+tween.dy*e;st.pitch=tween.p0+tween.dp*e;if(tween.t>=1)tween=null}
  if(!ptrs.size&&(st.vy||st.vp)){st.yaw+=st.vy*dt;st.pitch=clamp(st.pitch+st.vp*dt,-0.05,1.55);const f=Math.pow(.02,dt);st.vy*=f;st.vp*=f;if(Math.abs(st.vy)<.01)st.vy=0;if(Math.abs(st.vp)<.01)st.vp=0}
  if(st.Tto){let mv=false;for(let i=0;i<3;i++){const d=st.Tto[i]-T[i];if(Math.abs(d)>.01){T[i]+=d*Math.min(1,dt*4);mv=true}else T[i]=st.Tto[i]}if(!mv)st.Tto=null}
  if(st.dTo!=null){const d=st.dTo-st.dist;if(Math.abs(d)<.05){st.dist=st.dTo;st.dTo=null}else st.dist+=d*Math.min(1,dt*5)}
  if(st.gTo!=null){const d=st.gTo-st.g;if(Math.abs(d)<.01){st.g=st.gTo;st.gTo=null}else st.g+=d*Math.min(1,dt*6)}
  if(held.has('left'))st.yaw+=1.3*dt;if(held.has('right'))st.yaw-=1.3*dt;
  if(held.has('up'))st.pitch=clamp(st.pitch-0.9*dt,-0.05,1.55);if(held.has('down'))st.pitch=clamp(st.pitch+0.9*dt,-0.05,1.55);
  if(held.has('zin')||held.has('zout')){st.dTo=null;st.dist=clamp(st.dist*(held.has('zin')?1-0.9*dt:1+0.9*dt),6,140)}
  if(st.auto&&!ptrs.size)st.yaw-=0.25*dt;
  draw();cv.classList.add('ok')}
if(!HS()){consBtn.style.display='none';CB.temperature.style.display='none';V.temperature=false}
resize();ui();st.dist=st.dTo;st.dTo=null;if(st.Tto){for(let i=0;i<3;i++)T[i]=st.Tto[i];st.Tto=null}info();requestAnimationFrame(frame);
</script>
